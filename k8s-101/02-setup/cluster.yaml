# A kind cluster config used throughout this tutorial.
# - extraPortMappings let the Ingress controller (Lesson 08) receive
#   real traffic on host ports 80 and 443.
# - node-labels: ingress-ready=true is required by ingress-nginx on kind.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 443
        protocol: TCP
