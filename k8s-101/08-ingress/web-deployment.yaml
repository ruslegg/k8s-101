apiVersion: v1
kind: ConfigMap
metadata:
  name: web-html
data:
  index.html: |
    <!doctype html>
    <meta charset="utf-8">
    <title>Ingress demo</title>
    <h1>Hello from the web service</h1>
    <p>You reached this through the Ingress.</p>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: nginx
          image: nginx:alpine
          ports: [{ containerPort: 80 }]
          volumeMounts:
            - { name: html, mountPath: /usr/share/nginx/html }
      volumes:
        - name: html
          configMap: { name: web-html }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports:
    - { port: 80, targetPort: 80 }
