# DB credentials.
# We use stringData so we can write plaintext; K8s base64-encodes for us.
#
# In production: DO NOT check secrets into git. Use a real secrets
# manager (External Secrets Operator pulling from Vault / AWS Secrets
# Manager / Sealed Secrets / SOPS), or kubectl create secret from a
# secure store at deploy time.
apiVersion: v1
kind: Secret
metadata:
  name: db-creds
  namespace: capstone
type: Opaque
stringData:
  POSTGRES_USER: app
  POSTGRES_PASSWORD: supersecret
  POSTGRES_DB: app
