# nginx config for the web container.
#
# Important: in production we DON'T proxy /api here — the Ingress
# does that at the cluster edge. This nginx only serves the static
# bundle. The Ingress sends /api to the api Service directly.
server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # SPA routing: always serve index.html for unknown paths.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache static assets aggressively (they're content-hashed by Vite).
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # Tiny endpoint for container health.
  location /healthz {
    return 200 "ok\n";
    add_header Content-Type text/plain;
  }
}
